name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore (locked, with vulnerability audit)
        run: dotnet restore ElevatorSystem.slnx --locked-mode

      - name: Build
        run: dotnet build ElevatorSystem.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution ElevatorSystem.slnx --configuration Release --no-build

  publish-images:
    name: Publish ${{ matrix.image }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - project: src/ElevatorSystem.Api/ElevatorSystem.Api.csproj
            image: elevatorsystem-api
          - project: src/ElevatorSystem.Engine/ElevatorSystem.Engine.csproj
            image: elevatorsystem-engine
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Log in to GitHub Container Registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish container image
        id: publish
        env:
          PROJECT: ${{ matrix.project }}
          IMAGE: ${{ matrix.image }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          repository="${GITHUB_REPOSITORY_OWNER,,}/${IMAGE}"
          digest=$(dotnet publish "$PROJECT" --configuration Release \
            -t:PublishContainer \
            -p:ContainerRegistry=ghcr.io \
            -p:ContainerRepository="$repository" \
            -p:ContainerImageTags="\"$version;latest\"" \
            -getProperty:GeneratedContainerDigest)
          echo "name=ghcr.io/$repository" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

  github-release:
    name: GitHub release
    needs: publish-images
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
