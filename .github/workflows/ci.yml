name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore (locked, with vulnerability audit)
        run: dotnet restore ElevatorSystem.slnx --locked-mode

      - name: Check formatting and code style
        run: dotnet format ElevatorSystem.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build ElevatorSystem.slnx --configuration Release --no-restore

      # The end-to-end tests serve the UI over HTTPS (the staff cookie is Secure) and drive it in Chromium.
      - name: Prepare end-to-end tests
        run: |
          dotnet dev-certs https
          pwsh tests/ElevatorSystem.E2E.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      # The browser tests wait for their own step: containers started by the integration tests change the network
      # interfaces, and Chromium aborts requests in flight when that happens.
      - name: Test
        env:
          ELEVATOR_E2E: defer
        run: >-
          dotnet test --solution ElevatorSystem.slnx --configuration Release --no-build
          --results-directory TestResults
          --coverage --coverage-output-format cobertura
          --report-xunit-trx

      - name: End-to-end tests
        run: >-
          dotnet test --project tests/ElevatorSystem.E2E.Tests --configuration Release --no-build
          --results-directory TestResults
          --report-xunit-trx

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: warn
          retention-days: 14

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          comment-summary-in-pr: on-failure
